name: Build Static QEMU for Android (Working)

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential python3 ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libglib2.0-dev libpixman-1-dev libslirp-dev libusb-1.0-0-dev \
            libgcrypt20-dev libfdt-dev libcap-ng-dev zlib1g-dev

          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu
          mkdir build && cd build

          CC=aarch64-linux-gnu-gcc \
          AR=aarch64-linux-gnu-ar \
          LD=aarch64-linux-gnu-ld \
          ../configure \
            --target-list=aarch64-softmmu \
            --enable-kvm \
            --disable-werror \
            --disable-guest-agent \
            --static \
            --disable-docs \
            --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1 -static" \
            --extra-ldflags="-static"

          make -j$(nproc)
          aarch64-linux-gnu-strip qemu-system-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-static
          path: qemu/build/qemu-system-aarch64
