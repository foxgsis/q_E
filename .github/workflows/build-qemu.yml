name: Build QEMU 11.0.0 for Android ARM64 (with TLS fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential ninja-build pkg-config python3-pip \
            libglib2.0-dev libpixman-1-dev libepoxy-dev libsdl2-dev \
            libvirglrenderer-dev meson \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Checkout QEMU
        run: |
          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu

      - name: Configure QEMU with cross-compilation and TLS fix
        run: |
          cd qemu
          mkdir build && cd build
          # Кросс-компиляция для ARM64 с флагами выравнивания TLS
          CROSS_PREFIX=aarch64-linux-gnu- \
          LDFLAGS="-Wl,-z,max-page-size=64 -Wl,-z,common-page-size=64" \
          ../configure \
            --target-list=aarch64-softmmu \
            --cross-prefix=aarch64-linux-gnu- \
            --enable-sdl \
            --enable-opengl \
            --enable-virglrenderer \
            --enable-vnc \
            --disable-werror

      - name: Build QEMU
        run: |
          cd qemu/build
          make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-aarch64-android
          path: qemu/build/qemu-system-aarch64
