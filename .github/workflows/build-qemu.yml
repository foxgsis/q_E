name: Build QEMU 11.0.0 for Android ARM64 (with TLS fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential ninja-build pkg-config python3-pip \
            libglib2.0-dev libpixman-1-dev libepoxy-dev libsdl2-dev \
            libvirglrenderer-dev meson \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Checkout QEMU
        run: |
          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu

      - name: Create cross-compilation file
        run: |
          cat > /tmp/aarch64-cross.txt << EOF
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure QEMU with cross-compilation and TLS fix
        run: |
          cd qemu
          mkdir build && cd build
          LDFLAGS="-Wl,-z,max-page-size=64 -Wl,-z,common-page-size=64" \
          meson setup .. \
            --cross-file /tmp/aarch64-cross.txt \
            --prefix=/usr \
            --libdir=lib \
            -Dtarget_list=aarch64-softmmu \
            -Dsdl=enabled \
            -Dopengl=enabled \
            -Dvirglrenderer=enabled \
            -Dvnc=enabled \
            -Dwerror=false

      - name: Build QEMU
        run: |
          cd qemu/build
          ninja -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-aarch64-android
          path: qemu/build/qemu-system-aarch64
