name: Build QEMU 11.0.0 for Android 16 (Full Static)

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          # Установка ВСЕХ возможных зависимостей для статической сборки
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            python3 \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libglib2.0-dev-bin \
            libpixman-1-dev \
            libslirp-dev \
            libusb-1.0-0-dev \
            libgcrypt20-dev \
            libmount-dev \
            libudev-dev \
            libfdt-dev \
            libcap-ng-dev \
            libattr1-dev \
            libseccomp-dev \
            zlib1g-dev \
            liblzo2-dev \
            libsnappy-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            libcurl4-gnutls-dev \
            libnss3-dev \
            libpulse-dev \
            libsdl2-dev \
            libspice-protocol-dev \
            libspice-server-dev \
            libvirglrenderer-dev \
            libgtk-3-dev \
            libvte-2.91-dev \
            libpng-dev \
            libjpeg-dev \
            libsasl2-dev \
            libgnutls28-dev \
            nettle-dev \
            libtasn1-6-dev \
            libx11-dev \
            libxext-dev \
            libxcb1-dev \
            libxdmcp-dev \
            libxau-dev \
            libbrlapi-dev \
            libcacard-dev \
            libusbredirparser-dev \
            libvduse-dev \
            libvdutool-dev \
            libxml2-dev \
            libxslt1-dev \
            libdrm-dev \
            libepoxy-dev \
            libgbm-dev

          # Клонируем QEMU
          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu
          mkdir build && cd build
          
          # Конфигурация с максимальной статикой
          ../configure \
            --target-list=aarch64-softmmu \
            --enable-kvm \
            --disable-guest-agent \
            --disable-werror \
            --static \
            --enable-modules \
            --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1 -static -O2" \
            --extra-ldflags="-static -Wl,--allow-multiple-definition" \
            --disable-docs \
            --disable-gtk-doc \
            --disable-tools \
            --disable-blobs
            
          # Сборка
          make -j$(nproc)
          
          # Уменьшаем размер и делаем максимально совместимым
          strip --strip-all qemu-system-aarch64
          chmod 755 qemu-system-aarch64
          
          # Проверяем, что собралось
          file qemu-system-aarch64
          ls -lh qemu-system-aarch64
          
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-11.0.0-aarch64-static
          path: qemu/build/qemu-system-aarch64
          retention-days: 90
