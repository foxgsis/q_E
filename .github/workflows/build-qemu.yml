name: Build QEMU 11.0.0 for Android 16 (16k pages)

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libglib2.0-dev libpixman-1-dev libslirp-dev libusb-1.0-0-dev libgcrypt20-dev
          
          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu
          mkdir build && cd build
          
          
          ../configure \
            --target-list=aarch64-softmmu \
            --enable-kvm \
            --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1" \
            --static
          
          make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-static-16k
          path: qemu/build/qemu-system-aarch64
