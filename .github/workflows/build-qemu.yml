name: Build QEMU 11.0.0 for Android (ARM64 Native)

on: workflow_dispatch

jobs:
  build:
    # Используем официальный бесплатный ARM-раннер от GitHub
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential python3 ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libslirp-dev libusb-1.0-0-dev \
            libgcrypt20-dev libfdt-dev libcap-ng-dev zlib1g-dev

      - name: Clone QEMU source code
        run: git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git

      - name: Configure QEMU for static build with 16K pages
        run: |
          cd qemu
          mkdir build && cd build
          ../configure \
            --target-list=aarch64-softmmu \
            --enable-kvm \
            --disable-werror \
            --disable-guest-agent \
            --static \
            --disable-docs \
            --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1 -static -O2"

      - name: Build QEMU
        run: |
          cd qemu/build
          make -j$(nproc)
          strip qemu-system-aarch64

      - name: Upload final binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-static-aarch64
          path: qemu/build/qemu-system-aarch64
