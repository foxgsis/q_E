name: Cross-compile QEMU Static for Android

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential python3 ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

          # Добавляем ARM64 архитектуру
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          
          # Ставим зависимости для ARM64
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev:arm64 libpixman-1-dev:arm64 \
            libslirp-dev:arm64 libusb-1.0-0-dev:arm64 \
            libgcrypt20-dev:arm64 libfdt-dev:arm64 \
            libcap-ng-dev:arm64 libseccomp-dev:arm64 \
            libudev-dev:arm64 zlib1g-dev:arm64

          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu
          mkdir build && cd build

          # Создаём кросс-файл
          cat > cross-file.txt << 'EOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = '/usr/bin/pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          pkg_config_libdir = '/usr/lib/aarch64-linux-gnu/pkgconfig'
          EOF

          ../configure \
            --target-list=aarch64-softmmu \
            --enable-kvm \
            --disable-werror \
            --disable-guest-agent \
            --static \
            --cross-file=cross-file.txt \
            --disable-docs \
            --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1 -static -I/usr/include/aarch64-linux-gnu" \
            --extra-ldflags="-static -L/usr/lib/aarch64-linux-gnu"

          make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-static-aarch64
          path: qemu/build/qemu-system-aarch64
