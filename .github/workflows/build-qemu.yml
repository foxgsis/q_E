name: Build Static QEMU for Android

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential python3 python3-pip ninja-build \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config-aarch64-linux-gnu

          pip3 install meson

          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu

          cat > cross-build << 'EOF'
          #!/bin/bash
          mkdir -p build && cd build

          cat > meson.cross << 'CROSS'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'aarch64-linux-gnu-pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          CROSS

          ../configure \
            --target-list=aarch64-softmmu \
            --enable-kvm \
            --disable-werror \
            --disable-guest-agent \
            --static \
            --cross-file=meson.cross \
            --disable-docs \
            --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1 -static"

          make -j$(nproc)
          EOF

          chmod +x cross-build
          ./cross-build

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-static
          path: qemu/build/qemu-system-aarch64
