name: Build QEMU Static for Android

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential python3 ninja-build pkg-config \
            libglib2.0-dev libglib2.0-static \
            libpixman-1-dev libpixman-1-static \
            libslirp-dev libslirp-static \
            libusb-1.0-0-dev libusb-1.0-0-static \
            libgcrypt20-dev libgcrypt20-static \
            libfdt-dev libfdt-static \
            libcap-ng-dev libcap-ng-static \
            libseccomp-dev libseccomp-static \
            libudev-dev libudev-static \
            zlib1g-dev zlib1g-static \
            libzstd-dev libzstd-static \
            libpng-dev libpng-static \
            libjpeg-turbo8-dev libjpeg-turbo-static

          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu
          mkdir build && cd build

          ../configure \
            --target-list=aarch64-softmmu \
            --enable-kvm \
            --disable-werror \
            --disable-guest-agent \
            --static \
            --disable-docs \
            --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1 -static -O2" \
            --extra-ldflags="-static -lmount -ludev"

          make -j$(nproc)
          strip qemu-system-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-static-final
          path: qemu/build/qemu-system-aarch64
