name: Build my code-server

on:
  workflow_dispatch:  # Запуск вручную из интерфейса GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Собираем для основных платформ. Тебе нужна linux-arm64
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, windows-x64]
    steps:
      - name: Checkout code-server
        uses: actions/checkout@v4
        with:
          # Указываем официальный репозиторий code-server
          repository: coder/code-server
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Нужна версия 22 для стабильной сборки

      - name: Install dependencies
        run: npm install

      - name: Build for ${{ matrix.platform }}
        run: |
          # Ключевая команда. Она создает готовую сборку в папке ./release
          npm run release -- --target=${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-server-${{ matrix.platform }}
          path: ./release
