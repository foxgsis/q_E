name: Build QEMU Portable with Cuttlefish

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    container:
      image: debian:10-slim # Образ, который официально протестирован
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y git autoconf libtool texinfo python3

      - name: Clone Cuttlefish QEMU Build Repository
        run: |
          git clone https://android.googlesource.com/device/google/cuttlefish_vmm
          cd cuttlefish_vmm
          # Инициализация всех необходимых подмодулей
          git submodule update --init --recursive --depth 1

      - name: Run the Official QEMU Build Script
        run: |
          mkdir -p /tmp/qemu-build
          cd cuttlefish_vmm
          qemu/scripts/rebuild.sh --build-dir /tmp/qemu-build

      - name: Upload Portable QEMU Binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-portable
          # Путь, куда скрипт складывает собранный бинарник
          path: /tmp/qemu-build/qemu-portable.tar.gz
