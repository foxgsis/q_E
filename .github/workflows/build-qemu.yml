name: Build QEMU 11 for Termux (musl)

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential python3 ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libslirp-dev libusb-1.0-0-dev \
            libgcrypt20-dev libfdt-dev libcap-ng-dev \
            zlib1g-dev musl-tools

          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu
          
          # Создаём заглушку для futex.h
          mkdir -p linux
          echo '#include <linux/futex.h>' > linux/futex.h
          
          mkdir build && cd build

          ../configure \
            --target-list=aarch64-softmmu \
            --enable-kvm \
            --disable-werror \
            --disable-guest-agent \
            --cc=musl-gcc \
            --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1 -static -I$(pwd)/.." \
            --extra-ldflags="-static"

          make -j$(nproc) 2>&1 | grep -v "futex.h" || make

          strip qemu-system-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-musl-static
          path: qemu/build/qemu-system-aarch64
