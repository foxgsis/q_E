name: Build QEMU 11.0.0 for ARM64 (dynamic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential ninja-build pkg-config python3-pip \
            libglib2.0-dev libpixman-1-dev libepoxy-dev libsdl2-dev \
            libvirglrenderer-dev libxkbcommon-dev meson

      - name: Checkout QEMU
        run: |
          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu
          mkdir build && cd build
          ../configure \
            --target-list=aarch64-softmmu \
            --enable-sdl --enable-opengl --enable-virglrenderer --enable-vnc \
            --disable-werror
          make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-aarch64
          path: qemu/build/qemu-system-aarch64
