name: Build QEMU 11.0.0 with TLS alignment

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential ninja-build pkg-config python3-pip \
            libglib2.0-dev libpixman-1-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install modern meson
        run: |
          pip3 install --user meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Checkout QEMU
        run: |
          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu

      - name: Configure QEMU
        run: |
          cd qemu
          mkdir build && cd build
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          ../configure \
            --target-list=aarch64-softmmu \
            --cross-prefix=aarch64-linux-gnu- \
            --disable-xen \
            --extra-ldflags="-Wl,-z,max-page-size=64 -Wl,-z,common-page-size=64" \
            --disable-werror

      - name: Build QEMU
        run: |
          cd qemu/build
          make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-aligned
          path: qemu/build/qemu-system-aarch64
