name: Build QEMU 11.0.0 with TLS alignment

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libglib2.0-dev libpixman-1-dev
          git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git
          cd qemu
          mkdir build && cd build
          ../configure --target-list=aarch64-softmmu \
            --extra-ldflags="-Wl,-z,max-page-size=64 -Wl,-z,common-page-size=64"
          make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-aligned
          path: qemu/build/qemu-system-aarch64
