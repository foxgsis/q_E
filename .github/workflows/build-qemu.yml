name: Build Static QEMU for Android

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QEMU Source
        run: git clone --depth 1 --branch v11.0.0 https://git.qemu.org/git/qemu.git

      - name: Build Static QEMU in clean aarch64 environment
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          # Устанавливаем зависимости и собираем статику прямо внутри эмуляции ARM
          install: |
            apt-get update
            apt-get install -y git build-essential python3 ninja-build pkg-config \
              libglib2.0-dev libpixman-1-dev libslirp-dev libusb-1.0-0-dev \
              libgcrypt20-dev libfdt-dev libcap-ng-dev zlib1g-dev
          run: |
            cd qemu
            mkdir build && cd build
            ../configure \
              --target-list=aarch64-softmmu \
              --enable-kvm \
              --disable-werror \
              --disable-guest-agent \
              --static \
              --extra-cflags="-DCONFIG_ARM_VIRT_16K_PAGE=1 -static -O2" \
              --extra-ldflags="-static"
            make -j$(nproc)
            strip qemu-system-aarch64
            # Сохраняем бинарник в место, которое будет доступно после завершения эмуляции
            cp qemu-system-aarch64 ../../../
            
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-static-android
          path: qemu-system-aarch64
